<!DOCTYPE html>
<html>
  <head>
    <title>chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://roadmap.sh/backend"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput() {
        return (
          <div>
            <input 
              placeholder="Send a message to chatbot" 
              size="30"
            />
            <button>Send</button>
          </div>
        );
      }

      function ChatMessage(props) {
        const {message, sender} = props; 
        // const message = props.message;
        // const sender = props.sender;
        // if (sender == "bot") {
        //   return (
        //     <div>
        //       <img src="bot.png" width="50" />
        //       {message}
        //     </div>
        //   );
        // } else {
        //   return (
        //     <div>
        //       {message}
        //       <img src="user.png" width="50" />
        //     </div>
        //   );
        // }
        return(
          <div>
            {sender === "bot" && <img src="bot.png" width="50" />}
            {message}
            {sender === "user" && <img src="user.png" width="50" />}
        </div>
        );
      }

      function App()
      {
       return(
          <div>
            <ChatInput />
            <ChatMessage message="Hello Chatbot" sender="user" />
            <ChatMessage message="Hello! How can can i help you?" sender="bot" />
          </div>
        );
      }
        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App/>);
       </script>
       </body>
</html>
