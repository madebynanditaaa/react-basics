<!DOCTYPE html>
<html>
  <head>
    <title>chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://roadmap.sh/backend"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/dayjs"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({chatMessages, setChatMessages}) {
        const [inputText, setInputText] = React.useState("");
        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          setChatMessages([
            ...chatMessages,
            {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID,
            },
          ]);
          setInputText('');
        }

        return (
          <div>
            <input
              placeholder="Send a message to chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
            />
            <button onClick={sendMessage}>Send</button>
          </div>
        );
      }

      function ChatMessage(props) {
        const { message, sender } = props;
        return (
          <div>
            {sender === "bot" && <img src="bot.png" width="50" />}
            {message}
            {sender === "user" && <img src="user.png" width="50" />}
          </div>
        );
      }

      function ChatMessages({chatMessages}) {
        // const [chatMessages, setChatMessages] = array; // shortcut of below statement
        // const chatMessages = array[0]; // current data
        // const setChatMessages = array[1]; // updater function - to update the current data

        return (
          <>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  id={chatMessage.id}
                />
              );
            })}
          </>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          // [chatMessages, setChatMessages] is shortcut from below block 1st statement.
          { message: "Hello bot", sender: "user", id: "id1" },
          { message: "Hello user", sender: "bot", id: "id2" },
          { message: "Tell me todays date", sender: "user", id: "id3" },
          { message: "Today is 10th January", sender: "bot", id: "id4" },
        ]);
        return (
          <>
            <ChatInput
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
            />
            <ChatMessages
            chatMessages={chatMessages}
            />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
