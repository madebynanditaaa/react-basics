<!DOCTYPE html>
<html>
  <head>
    <title>2j</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ProductDetails({imgSrc, title, price, discountedPrice }) {
        if (discountedPrice) {
          <p>Discounted Price = </p>;
        }
        return (
          <>
            <p>......................</p> 
            <img src={imgSrc} width="100"/>
            <p>{name}</p>
            {discountedPrice ? (
              <del>
                <p>Price: {price}</p>
              </del>
            ) : (
              <p>Price: {price}</p>
            )}
            {discountedPrice && <p>Discounted Price: ${discountedPrice}</p>}
            <button>Add to Cart</button>
          </>
        );
      }

      function App() {
        return (
          <>
            <ProductDetails imgSrc="cotton-socks.png" name="Cotton socks" price="$10.90" />
            <ProductDetails imgSrc="plain-t-shirt.png" name="Tennis balls" price="$6.00" />
            <ProductDetails
              name="Plain T-Shirt"
              price="$7.99"
              discountedPrice="10"
              imgSrc="tennis-balls.png"
            />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
